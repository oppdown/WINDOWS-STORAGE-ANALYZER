name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo run -p storage-core --bin storage-analyzer -- . > scan.json
      - run: if ((Get-Content scan.json -Raw).Trim().Length -eq 0) { exit 1 }
        shell: pwsh

  frontend:
    name: Frontend contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop

  docs:
    name: Documentation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -s docs/index.html && test -s docs/changelog.html && grep -q 'WINDOWS STORAGE ANALYZER' docs/index.html
