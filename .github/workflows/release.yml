name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output WINDOWS-STORAGE-ANALYZER-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: WINDOWS-STORAGE-ANALYZER-${{ github.ref_name }}.zip
