name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output WINDOWS-STORAGE-ANALYZER-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: WINDOWS-STORAGE-ANALYZER-${{ github.ref_name }}.zip

  windows-installer:
    needs: source-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run tauri:build
      - name: Verify installer artifact
        shell: pwsh
        working-directory: .
        run: |
          $assets = Get-ChildItem -Path target\release\bundle\nsis -Filter *.exe -File
          if ($assets.Count -eq 0) { throw 'No NSIS installer was produced.' }
          $assets | ForEach-Object { Write-Output "$($_.FullName) $($_.Length) bytes" }
      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: target/release/bundle/nsis/*.exe
